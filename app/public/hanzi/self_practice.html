<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Self Practice</title>
<script src="./hanzi-writer.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fafafa;
    font-family: sans-serif;
  }
  #status {
    text-align: center;
    color: #888888;
    font-size: 12px;
    padding: 10px 16px 0;
    min-height: 16px;
  }
  #exercise-container {
    padding: 8px 16px 16px;
  }
  .exercise-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .exercise-row-label {
    flex: 0 0 auto;
    width: 40px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #999999;
  }
  .exercise-boxes {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .exercise-box {
    width: 90px;
    height: 90px;
    box-sizing: border-box;
    border: 1px solid #cccccc;
    background-color: #ffffff;
    background-image:
      linear-gradient(to right, #e5b0b0 1px, transparent 1px),
      linear-gradient(to bottom, #e5b0b0 1px, transparent 1px),
      linear-gradient(to bottom right, transparent calc(50% - 1px), #e5b0b0 calc(50% - 1px), #e5b0b0 calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom left, transparent calc(50% - 1px), #e5b0b0 calc(50% - 1px), #e5b0b0 calc(50% + 1px), transparent calc(50% + 1px));
    background-size: 100% 100%;
    background-position: center, center, 0 0, 0 0;
    background-repeat: no-repeat;
    cursor: crosshair;
  }
  .exercise-box.done {
    border-color: #39b54a;
    background-color: #f0fdf4;
  }
</style>
</head>
<body>
  <div id="status">Chọn một từ ở danh sách bên trái</div>
  <div id="exercise-container"></div>

  <script>
    const BOX_SIZE = 90;
    const BOX_PADDING = 4;
    // Số ô tự viết mỗi chữ — 2 ô đầu (index 0,1) theo checkbox "Hiện chữ mờ"
    // (selfPracticeShowOutline), 3 ô còn lại (index 2+) LUÔN viết tự do,
    // không có nét mẫu, để người dùng tự kiểm tra đã nhớ mặt chữ chưa.
    const REPEAT_COUNT = 5;
    const OUTLINE_BOX_COUNT = 2;

    window.selfPracticeWriters = []; // [{writer, box}, ...] — chỉ các ô có dữ liệu hợp lệ
    window.currentSelfPracticeWord = null;
    window.selfPracticeRunToken = 0;
    // Mặc định BẬT (giữ đúng hành vi cũ) — checkbox "Hiện chữ mờ" ở
    // game_hanzi_writing.py điều khiển qua setSelfPracticeShowOutline().
    window.selfPracticeShowOutline = true;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function loadSelfPractice(word, showOutline) {
      window.currentSelfPracticeWord = word;
      if (typeof showOutline === 'boolean') window.selfPracticeShowOutline = showOutline;
      const token = ++window.selfPracticeRunToken;

      const container = document.getElementById('exercise-container');
      container.innerHTML = '';
      window.selfPracticeWriters = [];

      const chars = Array.from(word);
      const entriesByChar = []; // entriesByChar[charIdx] = [{writer, box}, ...]
      const rowNodes = [];      // rowNodes[charIdx]
      const charFailed = new Array(chars.length).fill(false);
      let totalBoxes = 0;
      let settledBoxes = 0;
      let doneBoxes = 0;

      function updateProgress() {
        const total = window.selfPracticeWriters.length;
        if (total > 0) setStatus(`Đã viết đúng ${doneBoxes}/${total} ô.`);
      }

      // Chờ TẤT CẢ ô tải xong (dù thành công hay lỗi) rồi mới bật chế độ tự
      // viết — ký tự không có dữ liệu (chữ hiếm/lạ) bị ẩn cả hàng và bỏ qua,
      // KHÔNG làm cả từ không luyện được như trước.
      function onSettled() {
        settledBoxes += 1;
        if (settledBoxes < totalBoxes || token !== window.selfPracticeRunToken) return;

        let failedCount = 0;
        const goodEntries = [];
        chars.forEach((ch, idx) => {
          if (charFailed[idx]) {
            failedCount += 1;
            if (rowNodes[idx]) rowNodes[idx].style.display = 'none';
          } else {
            goodEntries.push(...entriesByChar[idx]);
          }
        });
        window.selfPracticeWriters = goodEntries;

        if (goodEntries.length === 0) {
          setStatus('Không tải được dữ liệu nét cho từ này (cần kết nối Internet).');
          return;
        }

        setStatus(
          failedCount > 0
            ? `Hãy tự viết vào từng ô (bỏ qua ${failedCount} ký tự không có dữ liệu).`
            : 'Hãy tự viết vào từng ô.'
        );

        // Bật chế độ viết (quiz) cho TẤT CẢ ô cùng lúc — người dùng có thể tự
        // viết vào bất kỳ ô nào theo ý muốn, không bắt buộc đúng thứ tự.
        goodEntries.forEach((entry) => {
          entry.writer.quiz({
            onComplete: () => {
              doneBoxes += 1;
              if (entry.box) entry.box.classList.add('done');
              updateProgress();
            },
          });
        });
      }

      chars.forEach((ch, charIdx) => {
        const row = document.createElement('div');
        row.className = 'exercise-row';

        const label = document.createElement('div');
        label.className = 'exercise-row-label';
        label.textContent = ch;
        row.appendChild(label);

        const boxesWrap = document.createElement('div');
        boxesWrap.className = 'exercise-boxes';
        row.appendChild(boxesWrap);

        container.appendChild(row);
        rowNodes.push(row);

        const rowEntries = [];
        for (let i = 0; i < REPEAT_COUNT; i++) {
          const box = document.createElement('div');
          box.className = 'exercise-box';
          const boxId = 'self-box-' + token + '-' + charIdx + '-' + i;
          box.id = boxId;
          boxesWrap.appendChild(box);
          totalBoxes += 1;

          // showCharacter:false + showOutline dùng màu mờ -> hiện chữ mờ làm
          // nét mẫu để người dùng tự đồ theo, không tự động viết hộ. Chỉ áp
          // dụng cho OUTLINE_BOX_COUNT ô đầu (và còn tuỳ checkbox "Hiện chữ
          // mờ" nữa) — các ô sau đó LUÔN showOutline:false (viết tự do,
          // không có nét mẫu, chỉ còn ô trống kẻ sẵn theo background-image
          // của .exercise-box) để tự kiểm tra đã nhớ mặt chữ hay chưa.
          const useOutline = i < OUTLINE_BOX_COUNT && window.selfPracticeShowOutline;
          const writer = HanziWriter.create(boxId, ch, {
            width: BOX_SIZE,
            height: BOX_SIZE,
            padding: BOX_PADDING,
            showCharacter: false,
            showOutline: useOutline,
            outlineColor: 'rgba(43, 43, 43, 0.25)',
            strokeColor: '#2b2b2b',
            drawingWidth: 40,
            onLoadCharDataSuccess: () => {
              onSettled();
            },
            onLoadCharDataError: () => {
              charFailed[charIdx] = true;
              onSettled();
            },
          });
          rowEntries.push({ writer, box });
        }
        entriesByChar.push(rowEntries);
      });

      setStatus('Đang tải nét chữ...');
    }

    function replaySelfPractice() {
      if (window.currentSelfPracticeWord) {
        loadSelfPractice(window.currentSelfPracticeWord, window.selfPracticeShowOutline);
      }
    }

    // Đổi checkbox "Hiện chữ mờ" khi đang xem 1 từ — vẽ lại NGAY ô đang mở
    // theo trạng thái mới, không cần chờ chuyển sang từ khác.
    function setSelfPracticeShowOutline(showOutline) {
      window.selfPracticeShowOutline = !!showOutline;
      if (window.currentSelfPracticeWord) {
        loadSelfPractice(window.currentSelfPracticeWord, window.selfPracticeShowOutline);
      }
    }
  </script>
</body>
</html>
